services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: event-onboarding-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  apicurio-registry:
    image: apicurio/apicurio-registry-mem:2.5.11.Final
    container_name: event-onboarding-apicurio
    ports:
      # Host 8081 -> container 8080 (the Spring app already uses 8080).
      - "8081:8080"

  sonarqube:
    image: sonarqube:26.6.0.123539-community
    container_name: event-onboarding-sonarqube
    ports:
      - "9000:9000"
    environment:
      # Suitable for local evaluation; production instances must satisfy the
      # documented Elasticsearch host requirements instead.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-proxy -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  rabbitmq-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
